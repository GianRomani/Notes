[build]
command = "export SITE_URL=${DEPLOY_PRIME_URL:-$SITE_URL} && rm -rf __obsidian __site && mkdir __obsidian && mv * __obsidian || true && git clone https://github.com/ppeetteerrs/obsidian-zola.git __site && (cp -rf __obsidian/custom-site-assets/* __site/zola/ || true) && __site/run.sh"
publish = "public"

[build.environment]
# (Optional) Text in landing page button
LANDING_BUTTON = "Start here!"
# (Optional) Site description on landing page
LANDING_DESCRIPTION = "Notes about things I find interesting"
# (REQUIRED) The Markdown page linked to landing page button (e.g. put home for ./home.md)
LANDING_PAGE = "README"
# (Optional) Site title on landing page
LANDING_TITLE = "Gianfranco's notes"
PYTHON_VERSION = "3.8"
NODE_VERSION = "24"
# (REQUIRED) Site repo URL
REPO_URL = "https://github.com/GianRomani/Notes"
# (Optional) Site title in navbar
SITE_TITLE = "Gianfranco's Notes"
# (Optional) Site title in browser tab (leave blank to use SITE_TITLE)
SITE_TITLE_TAB = ""
# (REQUIRED) Netlify site URL
SITE_URL = "https://gianfree-notes.netlify.app"
# (Optional) Site Timezone
TIMEZONE = "Europe/Italy"
ZOLA_VERSION = "0.15.2"
# (Optional, default title) How to sort notes inside each section on the right sidebar ("date" or "title"). Subsections on side bar are sorted by title, the sort order cannot be changed.
SORT_BY = "title"
# (Optional) Minimalist indicator for nested categories in the left sidebar menu (replaces default 👉)
SUBSECTION_SYMBOL = "– "
# (Optional) Google Analytics Measurement ID
GANALYTICS = ""
# (Optional, default true) Slugify URLs. Put "" to disable.
SLUGIFY = "y"
# (Optional, default true) Shows knowledge graph on home page. Put "" to disable.
BORDER_COLLAPSED = ""
HOME_GRAPH = "y"
# (Optional, default true) Shows knowledge graph on every page. Put "" to disable.
PAGE_GRAPH = "y"
# (Optional, default false) Whether sidebar sections should be collapsed by default.
SIDEBAR_COLLAPSED = ""
# (Optional, default blank) Additional footer content.
FOOTER = ""
# (Optional, default main) Root section name.
ROOT_SECTION_NAME = "main"
# (Optional) visjs graph options. Can remove if desired.
GRAPH_OPTIONS = """
        {
        	nodes: {
        		shape: "dot",
        		color: isDark() ? "#63afae" : "#4e8f8e",
        		font: {
        			face: "Plus Jakarta Sans",
        			color: isDark() ? "#e6dfd3" : "#2b2d2f",
        			strokeColor: isDark() ? "#1b1c1e" : "#fdfbf7",
        			strokeWidth: 4,
        			size: 15,
        		},
        		scaling: {
        			label: {
        				enabled: true,
        				min: 13,
        				max: 22,
        			},
        		},
        	},
        	edges: {
        		color: isDark() ? "rgba(99, 175, 174, 0.2)" : "rgba(78, 143, 142, 0.2)",
        		width: 0.8,
        		smooth: {
        			type: "continuous",
        		},
        		hoverWidth: 4,
        	},
        	interaction: {
        		hover: true,
        	},
        	height: "100%",
        	width: "100%",
        	physics: {
        		solver: "repulsion",
        		repulsion: {
        			nodeDistance: 220,
        			centralGravity: 0.1,
        			springLength: 200,
        			springConstant: 0.05,
        			damping: 0.09,
        		},
        	},
        }
        """

