{% macro docs_graph(page, current_section) %}
<div class="card graph-card mt-5 mb-4">
  <div class="graph-card-header d-flex justify-content-between align-items-center">
    <span class="d-flex align-items-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-share-2" style="vertical-align: middle; margin-right: 6px; color: var(--accent-teal);"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Local Knowledge Graph
    </span>
    <div class="graph-controls d-flex align-items-center">
      <button id="zoom-in-btn" class="btn btn-sm btn-graph-control" aria-label="Zoom In" title="Zoom In">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button id="zoom-out-btn" class="btn btn-sm btn-graph-control" aria-label="Zoom Out" title="Zoom Out">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-minus"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </div>
  <div class="graph-canvas-wrapper">
    <div class="docs-graph" id="graph"></div>
  </div>
</div>
{% endmacro %}
